<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jira Issue Viewer - QEVENTTH & TVPLAT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e4e4e4;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
            font-size: 2rem;
        }

        /* Login Section */
        .login-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-section h2 {
            margin-bottom: 20px;
            color: #00d4ff;
            font-size: 1.2rem;
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #000;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Status Messages */
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .status.error {
            background: rgba(255, 82, 82, 0.2);
            border: 1px solid #ff5252;
            color: #ff8a8a;
            display: block;
        }

        .status.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #81c784;
            display: block;
        }

        .status.loading {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #ffc107;
            color: #ffd54f;
            display: block;
        }

        /* Issues Container */
        .issues-container {
            display: grid;
            gap: 20px;
        }

        .issue-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .issue-card:hover {
            border-color: #00d4ff;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .issue-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .issue-key {
            font-size: 1.3rem;
            font-weight: 700;
            color: #00d4ff;
        }

        .issue-key a {
            color: inherit;
            text-decoration: none;
        }

        .issue-key a:hover {
            text-decoration: underline;
        }

        .issue-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-open, .status-todo { background: #2196f3; color: #fff; }
        .status-inprogress, .status-in-progress { background: #ff9800; color: #000; }
        .status-done, .status-closed, .status-resolved { background: #4caf50; color: #fff; }
        .status-blocked { background: #f44336; color: #fff; }
        .status-default { background: #9e9e9e; color: #fff; }

        .issue-summary {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #fff;
            line-height: 1.5;
        }

        .issue-fields {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .field-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
        }

        .field-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field-value {
            color: #e4e4e4;
            word-break: break-word;
        }

        .field-value.empty {
            color: #666;
            font-style: italic;
        }

        /* Description field - full width */
        .field-item.full-width {
            grid-column: 1 / -1;
        }

        .field-value.description {
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Labels and Components */
        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .tag {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
        }

        /* Quick Filter Presets */
        .presets-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .presets-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 15px;
        }

        .preset-btn {
            padding: 8px 16px;
            border: 1px solid rgba(0, 212, 255, 0.5);
            border-radius: 20px;
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .preset-btn:hover, .preset-btn.active {
            background: rgba(0, 212, 255, 0.3);
            border-color: #00d4ff;
        }

        .filter-options {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            color: #aaa;
            font-size: 0.9rem;
        }

        .filter-group input[type="text"] {
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 0.9rem;
            width: 150px;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-item span {
            color: #e4e4e4;
            font-size: 0.9rem;
        }

        /* Summary Stats */
        .stats-bar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #00d4ff;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #888;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-input {
            flex: 1;
            min-width: 250px;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
        }

        /* Custom JQL */
        .jql-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .jql-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 0.95rem;
            font-family: monospace;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }
            
            .issue-fields {
                grid-template-columns: 1fr;
            }
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #00d4ff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Expand/Collapse */
        .expand-btn {
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        .expand-btn:hover {
            background: rgba(0, 212, 255, 0.3);
        }

        .all-fields {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .all-fields.expanded {
            display: block;
        }

        /* Raw JSON view */
        .json-view {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: monospace;
            font-size: 0.85rem;
            max-height: 400px;
            overflow-y: auto;
        }

        /* Issue Selection */
        .selection-toolbar {
            display: none;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 153, 204, 0.1));
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .selection-toolbar.visible {
            display: flex;
        }

        .selection-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .selection-count {
            font-size: 1.1rem;
            color: #00d4ff;
            font-weight: 600;
        }

        .selection-actions {
            display: flex;
            gap: 10px;
        }

        .btn-analyze {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #000;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .issue-checkbox {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            z-index: 10;
        }

        .issue-card {
            position: relative;
        }

        .issue-card.selected {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }

        .select-all-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }

        .select-all-row label {
            color: #aaa;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Analytics Dashboard */
        .analytics-dashboard {
            padding: 25px;
        }

        .analytics-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .analytics-header h2 {
            color: #00d4ff;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .analytics-header p {
            color: #888;
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .analytics-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        .analytics-card .icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .analytics-card .value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .analytics-card .label {
            color: #888;
            font-size: 0.9rem;
        }

        .analytics-card .sub-value {
            color: #aaa;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        /* Chart Container */
        .chart-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .chart-section h3 {
            color: #fff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bar-label {
            width: 150px;
            color: #aaa;
            font-size: 0.9rem;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bar-wrapper {
            flex: 1;
            height: 35px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            transition: width 0.5s ease;
            min-width: fit-content;
        }

        .bar-fill.holding { background: linear-gradient(135deg, #2196f3, #1976d2); }
        .bar-fill.resolution { background: linear-gradient(135deg, #4caf50, #388e3c); }
        .bar-fill.waiting { background: linear-gradient(135deg, #ff9800, #f57c00); }

        .bar-value {
            width: 80px;
            text-align: right;
            color: #00d4ff;
            font-weight: 600;
        }

        /* Pie Chart (CSS only) */
        .pie-chart-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .pie-chart {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            position: relative;
        }

        .pie-legend {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .pie-legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pie-legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .pie-legend-text {
            color: #aaa;
            font-size: 0.9rem;
        }

        .pie-legend-value {
            color: #00d4ff;
            font-weight: 600;
            margin-left: auto;
        }

        /* Issue Breakdown Table */
        .breakdown-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .breakdown-table th,
        .breakdown-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .breakdown-table th {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .breakdown-table td {
            color: #e4e4e4;
        }

        .breakdown-table tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }

        .mini-bar {
            width: 100px;
            height: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
        }

        .mini-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border-radius: 4px;
        }

        /* Issue Detail Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 16px;
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header h2 {
            color: #00d4ff;
            font-size: 1.3rem;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover {
            color: #fff;
        }

        .modal-body {
            padding: 25px;
        }

        /* Timeline Styles */
        .timeline-section {
            margin-bottom: 30px;
        }

        .timeline-section h3 {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timeline {
            position: relative;
            padding-left: 30px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, #00d4ff, #0099cc, #006699);
        }

        .timeline-item {
            position: relative;
            padding-bottom: 25px;
        }

        .timeline-item:last-child {
            padding-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -26px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00d4ff;
            border: 3px solid #1a1a2e;
        }

        .timeline-dot.created { background: #4caf50; }
        .timeline-dot.assigned { background: #2196f3; }
        .timeline-dot.status { background: #ff9800; }
        .timeline-dot.resolved { background: #9c27b0; }
        .timeline-dot.closed { background: #f44336; }

        .timeline-content {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin-left: 10px;
        }

        .timeline-date {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 5px;
        }

        .timeline-title {
            font-weight: 600;
            color: #fff;
            margin-bottom: 5px;
        }

        .timeline-detail {
            font-size: 0.9rem;
            color: #aaa;
        }

        .timeline-detail .from-to {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timeline-detail .arrow {
            color: #00d4ff;
        }

        /* Stats Cards in Modal */
        .issue-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-card .stat-icon {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .stat-card .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #00d4ff;
        }

        .stat-card .stat-label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }

        /* Duration bar */
        .duration-bar {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .duration-bar h4 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .bar-container {
            height: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            overflow: hidden;
            display: flex;
        }

        .bar-segment {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #fff;
            font-weight: 600;
            min-width: 40px;
        }

        .bar-segment.open { background: #2196f3; }
        .bar-segment.in-progress { background: #ff9800; }
        .bar-segment.resolved { background: #9c27b0; }
        .bar-segment.closed { background: #4caf50; }

        .bar-legend {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .clickable-card {
            cursor: pointer;
        }

        .clickable-card:hover .issue-key a {
            text-decoration: underline;
        }
    </style>
</head>
<body>

        <!-- Status Messages -->

            <div class="stat-item">

                <div class="stat-label">Open</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="inProgressCount">0</div>
                <div class="stat-label">In Progress</div>

        <!-- Filters -->

                   placeholder="🔍 Search issues by key, summary, assignee..." oninput="filterIssues()">

                <option value="">All Statuses</option>

        <!-- Selection Toolbar -->
        <div id="selectionToolbar" class="selection-toolbar">

                <button class="btn-analyze" onclick="analyzeSelectedIssues()">📊 Analyze Selected</button>

        <!-- Analytics Modal -->

            <div class="modal-content" style="max-width: 1100px;" onclick="event.stopPropagation()">
                <div class="modal-header">
                    <h2>📊 Issues Analytics Dashboard</h2>
                    <button class="modal-close" onclick="closeAnalyticsModal()">&times;</button>
                </div>

                    <div style="text-align: center; padding: 40px;">
                        <div class="spinner"></div> Analyzing issues...
                    </div>

    <script>
        let allIssues = [];
        let allStatuses = new Set();
        let currentPreset = 'recent';
        let selectedIssues = new Set();

        // Get proxy base URL - works for local dev and Vercel deployment
        function getProxyBase() {
            // If running locally with proxy server
            if (window.location.hostname === 'localhost' && window.location.port === '3000') {
                return 'http://localhost:3000';
            }
            // If running on Vercel or any other host, use same origin
            if (window.location.hostname !== '127.0.0.1' && window.location.port !== '5500') {
                return window.location.origin;
            }
            // Default to localhost proxy for local development
            return 'http://localhost:3000';
        }

        // Selection functions
        function toggleIssueSelection(issueKey, checkbox) {
            event.stopPropagation();
            if (checkbox.checked) {
                selectedIssues.add(issueKey);
            } else {
                selectedIssues.delete(issueKey);
            }
            updateSelectionUI();
        }

        function updateSelectionUI() {
            const count = selectedIssues.size;
            document.getElementById('selectedCount').textContent = count;
            
            const toolbar = document.getElementById('selectionToolbar');
            if (count > 0) {
                toolbar.classList.add('visible');
            } else {
                toolbar.classList.remove('visible');
            }

            // Update card styles
            document.querySelectorAll('.issue-card').forEach(card => {
                const key = card.dataset.key;
                if (selectedIssues.has(key)) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            });

            // Update select all checkbox
            const allCheckboxes = document.querySelectorAll('.issue-checkbox');
            const selectAllCheckbox = document.getElementById('selectAll');
            if (allCheckboxes.length > 0 && selectedIssues.size === allCheckboxes.length) {
                selectAllCheckbox.checked = true;
            } else {
                selectAllCheckbox.checked = false;
            }
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll').checked;
            const checkboxes = document.querySelectorAll('.issue-checkbox');
            
            checkboxes.forEach(cb => {
                cb.checked = selectAll;
                const issueKey = cb.dataset.key;
                if (selectAll) {
                    selectedIssues.add(issueKey);
                } else {
                    selectedIssues.delete(issueKey);
                }
            });
            
            updateSelectionUI();
        }

        function clearSelection() {
            selectedIssues.clear();
            document.querySelectorAll('.issue-checkbox').forEach(cb => cb.checked = false);
            document.getElementById('selectAll').checked = false;
            updateSelectionUI();
        }

        // Analytics functions
        async function analyzeSelectedIssues() {
            if (selectedIssues.size === 0) {
                alert('Please select at least one issue to analyze');
                return;
            }

            const modal = document.getElementById('analyticsModal');
            const body = document.getElementById('analyticsBody');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            body.innerHTML = '<div style="text-align: center; padding: 40px;"><div class="spinner"></div> Fetching issue history for analysis...</div>';

            try {
                const assigneeFilter = document.getElementById('assigneeFilter').value.trim();
                const issueKeys = Array.from(selectedIssues);
                
                // Fetch changelog for all selected issues
                const issueData = await Promise.all(issueKeys.map(key => fetchIssueWithChangelog(key)));
                
                // Calculate analytics
                const analytics = calculateAnalytics(issueData, assigneeFilter);
                
                // Display dashboard
                displayAnalyticsDashboard(analytics, assigneeFilter);
                
            } catch (error) {
                console.error('Error analyzing issues:', error);
                body.innerHTML = `<div style="text-align: center; padding: 40px; color: #ff5252;">❌ Error: ${error.message}</div>`;
            }
        }

        async function fetchIssueWithChangelog(issueKey) {
            const jiraUrl = document.getElementById('jiraUrl').value.replace(/\/$/, '');
            const token = document.getElementById('token').value.trim();
            
            const apiUrl = `${jiraUrl}/rest/api/2/issue/${issueKey}?expand=changelog`;
            const url = `${getProxyBase()}/api/jira-proxy?url=${encodeURIComponent(apiUrl)}`;
            
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error(`Failed to fetch ${issueKey}`);
            }

            return response.json();
        }

        function calculateAnalytics(issues, targetAssignee) {
            const results = {
                totalIssues: issues.length,
                resolvedIssues: 0,
                totalResolutionDays: 0,
                avgResolutionDays: 0,
                totalHoldingDays: 0,
                avgHoldingDays: 0,
                issueBreakdown: [],
                assigneeHoldingTotal: 0
            };

            issues.forEach(issue => {
                const fields = issue.fields;
                const changelog = issue.changelog?.histories || [];
                const created = new Date(fields.created);
                const resolved = fields.resolutiondate ? new Date(fields.resolutiondate) : null;
                const now = new Date();
                
                // Calculate resolution time
                let resolutionDays = null;
                if (resolved) {
                    resolutionDays = (resolved - created) / (1000 * 60 * 60 * 24);
                    results.resolvedIssues++;
                    results.totalResolutionDays += resolutionDays;
                }

                // Calculate time the target assignee held the issue
                let holdingDays = calculateAssigneeHoldingTime(issue, changelog, targetAssignee, created, resolved || now);
                results.totalHoldingDays += holdingDays;

                results.issueBreakdown.push({
                    key: issue.key,
                    summary: fields.summary,
                    status: fields.status?.name,
                    created: created,
                    resolved: resolved,
                    resolutionDays: resolutionDays,
                    holdingDays: holdingDays,
                    currentAssignee: fields.assignee?.displayName || fields.assignee?.name || 'Unassigned',
                    totalDays: (resolved || now) - created
                });
            });

            // Calculate averages
            if (results.resolvedIssues > 0) {
                results.avgResolutionDays = results.totalResolutionDays / results.resolvedIssues;
            }
            if (results.totalIssues > 0) {
                results.avgHoldingDays = results.totalHoldingDays / results.totalIssues;
            }

            // Sort breakdown by holding days descending
            results.issueBreakdown.sort((a, b) => b.holdingDays - a.holdingDays);

            return results;
        }

        function calculateAssigneeHoldingTime(issue, changelog, targetAssignee, created, endDate) {
            if (!targetAssignee) {
                // If no target assignee specified, calculate total time current assignee held it
                targetAssignee = issue.fields.assignee?.name || issue.fields.assignee?.displayName;
            }

            let totalHoldingMs = 0;
            let currentAssignee = issue.fields.reporter?.name || issue.fields.reporter?.displayName; // Initial assignee is often reporter
            let lastChangeDate = created;
            
            // Build assignee change events
            const assigneeChanges = [];
            
            changelog.forEach(history => {
                const date = new Date(history.created);
                history.items.forEach(item => {
                    if (item.field === 'assignee') {
                        assigneeChanges.push({
                            date: date,
                            from: item.fromString || item.from,
                            to: item.toString || item.to
                        });
                    }
                });
            });

            // Sort by date
            assigneeChanges.sort((a, b) => a.date - b.date);

            // Calculate holding time
            assigneeChanges.forEach(change => {
                // Check if the previous assignee was our target
                if (isMatchingAssignee(currentAssignee, targetAssignee)) {
                    totalHoldingMs += change.date - lastChangeDate;
                }
                currentAssignee = change.to;
                lastChangeDate = change.date;
            });

            // Add remaining time if currently assigned to target
            if (isMatchingAssignee(currentAssignee, targetAssignee)) {
                totalHoldingMs += endDate - lastChangeDate;
            }

            // Also check if never reassigned and initially assigned to target
            if (assigneeChanges.length === 0) {
                const initialAssignee = issue.fields.assignee?.name || issue.fields.assignee?.displayName;
                if (isMatchingAssignee(initialAssignee, targetAssignee)) {
                    totalHoldingMs = endDate - created;
                }
            }

            return totalHoldingMs / (1000 * 60 * 60 * 24); // Convert to days
        }

        function isMatchingAssignee(assignee, target) {
            if (!assignee || !target) return false;
            const a = assignee.toLowerCase();
            const t = target.toLowerCase();
            return a.includes(t) || t.includes(a);
        }

        function displayAnalyticsDashboard(analytics, assignee) {
            const body = document.getElementById('analyticsBody');
            const maxHoldingDays = Math.max(...analytics.issueBreakdown.map(i => i.holdingDays), 1);
            const maxResolutionDays = Math.max(...analytics.issueBreakdown.filter(i => i.resolutionDays).map(i => i.resolutionDays), 1);

            body.innerHTML = `
                <div class="analytics-dashboard">
                    <div class="analytics-header">
                        <h2>📊 Issues Analytics</h2>
                        <p>Analysis for ${analytics.totalIssues} selected issues ${assignee ? `• Assignee: <strong>${assignee}</strong>` : ''}</p>
                    </div>

                    <!-- Summary Cards -->
                    <div class="analytics-grid">
                        <div class="analytics-card">
                            <div class="icon">📋</div>
                            <div class="value">${analytics.totalIssues}</div>
                            <div class="label">Total Issues Analyzed</div>
                        </div>
                        <div class="analytics-card">
                            <div class="icon">✅</div>
                            <div class="value">${analytics.resolvedIssues}</div>
                            <div class="label">Resolved Issues</div>
                            <div class="sub-value">${((analytics.resolvedIssues / analytics.totalIssues) * 100).toFixed(1)}% resolution rate</div>
                        </div>
                        <div class="analytics-card">
                            <div class="icon">⏱️</div>
                            <div class="value">${analytics.avgResolutionDays.toFixed(1)}</div>
                            <div class="label">Avg Days to Resolve</div>
                            <div class="sub-value">Total: ${analytics.totalResolutionDays.toFixed(1)} days</div>
                        </div>
                        <div class="analytics-card">
                            <div class="icon">👤</div>
                            <div class="value">${analytics.avgHoldingDays.toFixed(1)}</div>
                            <div class="label">Avg Days Held by ${assignee || 'Assignee'}</div>
                            <div class="sub-value">Total: ${analytics.totalHoldingDays.toFixed(1)} days</div>
                        </div>
                    </div>

                    <!-- Holding Time Chart -->
                    <div class="chart-section">
                        <h3>👤 Time Held by ${assignee || 'Current Assignee'} (per issue)</h3>
                        <div class="bar-chart">
                            ${analytics.issueBreakdown.slice(0, 15).map(issue => `
                                <div class="bar-row">
                                    <div class="bar-label" title="${issue.summary}">${issue.key}</div>
                                    <div class="bar-wrapper">
                                        <div class="bar-fill holding" style="width: ${(issue.holdingDays / maxHoldingDays) * 100}%;">
                                            ${issue.holdingDays.toFixed(1)}d
                                        </div>
                                    </div>
                                    <div class="bar-value">${issue.holdingDays.toFixed(1)} days</div>
                                </div>
                            `).join('')}
                        </div>
                        ${analytics.issueBreakdown.length > 15 ? `<p style="color: #888; margin-top: 15px; text-align: center;">Showing top 15 of ${analytics.issueBreakdown.length} issues</p>` : ''}
                    </div>

                    <!-- Resolution Time Chart -->
                    <div class="chart-section">
                        <h3>⏱️ Resolution Time (per issue)</h3>
                        <div class="bar-chart">
                            ${analytics.issueBreakdown
                                .filter(i => i.resolutionDays !== null)
                                .sort((a, b) => b.resolutionDays - a.resolutionDays)
                                .slice(0, 15)
                                .map(issue => `
                                <div class="bar-row">
                                    <div class="bar-label" title="${issue.summary}">${issue.key}</div>
                                    <div class="bar-wrapper">
                                        <div class="bar-fill resolution" style="width: ${(issue.resolutionDays / maxResolutionDays) * 100}%;">
                                            ${issue.resolutionDays.toFixed(1)}d
                                        </div>
                                    </div>
                                    <div class="bar-value">${issue.resolutionDays.toFixed(1)} days</div>
                                </div>
                            `).join('')}
                            ${analytics.issueBreakdown.filter(i => i.resolutionDays === null).length > 0 ? 
                                `<p style="color: #888; margin-top: 15px;">${analytics.issueBreakdown.filter(i => i.resolutionDays === null).length} issues not yet resolved</p>` : ''}
                        </div>
                    </div>

                    <!-- Detailed Breakdown Table -->
                    <div class="chart-section">
                        <h3>📝 Detailed Breakdown</h3>
                        <div style="overflow-x: auto;">
                            <table class="breakdown-table">
                                <thead>
                                    <tr>
                                        <th>Issue</th>
                                        <th>Status</th>
                                        <th>Days Held by ${assignee || 'Assignee'}</th>
                                        <th>Resolution Time</th>
                                        <th>Current Assignee</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${analytics.issueBreakdown.map(issue => `
                                        <tr>
                                            <td>
                                                <strong style="color: #00d4ff;">${issue.key}</strong>
                                                <div style="font-size: 0.85rem; color: #888; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                                    ${escapeHtml(issue.summary)}
                                                </div>
                                            </td>
                                            <td><span class="issue-status ${getStatusClass(issue.status)}" style="font-size: 0.75rem;">${issue.status}</span></td>
                                            <td>
                                                ${issue.holdingDays.toFixed(1)} days
                                                <div class="mini-bar">
                                                    <div class="mini-bar-fill" style="width: ${(issue.holdingDays / maxHoldingDays) * 100}%;"></div>
                                                </div>
                                            </td>
                                            <td>${issue.resolutionDays !== null ? issue.resolutionDays.toFixed(1) + ' days' : '<span style="color: #ff9800;">Open</span>'}</td>
                                            <td>${issue.currentAssignee}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function closeAnalyticsModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('analyticsModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function setPreset(preset) {
            currentPreset = preset;
            // Update button styles
            document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function buildJQL() {
            const projects = document.getElementById('project').value;
            const projectList = projects.split(',').map(p => `"${p.trim()}"`).join(', ');
            const assignee = document.getElementById('assigneeFilter').value.trim();
            
            // For custom JQL, return as-is
            if (currentPreset === 'custom') {
                const customJql = document.getElementById('customJql').value.trim();
                if (customJql) {
                    return customJql;
                }
            }
            
            let jql = `project IN (${projectList})`;

            // Always apply assignee filter if provided (or currentUser for myissues)
            if (currentPreset === 'myissues') {
                if (assignee) {
                    jql += ` AND assignee = "${assignee}"`;
                } else {
                    jql += ` AND assignee = currentUser()`;
                }
            } else if (assignee) {
                jql += ` AND assignee = "${assignee}"`;
            }

            // Always apply status filter based on checkboxes
            const statuses = [];
            if (document.getElementById('statusFixready').checked) statuses.push('"Fixready"');
            if (document.getElementById('statusInProgress').checked) statuses.push('"In Progress"');
            if (document.getElementById('statusResolved').checked) statuses.push('"Resolved"');
            if (document.getElementById('statusClosed').checked) statuses.push('"Closed"');
            
            // Only add status filter if not all checkboxes are checked (filtering)
            const allChecked = statuses.length === 4;
            const noneChecked = statuses.length === 0;
            
            if (!allChecked && !noneChecked) {
                jql += ` AND status IN (${statuses.join(', ')})`;
            }
            
            jql += ' ORDER BY updated DESC';
            return jql;
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.className = `status ${type}`;
            statusEl.innerHTML = type === 'loading' 
                ? `<span class="spinner"></span>${message}` 
                : message;
        }

        function hideStatus() {
            document.getElementById('status').className = 'status';
        }

        async function fetchIssues() {
            const jiraUrl = document.getElementById('jiraUrl').value.replace(/\/$/, '');
            const token = document.getElementById('token').value.trim();

            if (!token) {
                showStatus('Please enter your Personal Access Token', 'error');
                return;
            }

            const fetchBtn = document.getElementById('fetchBtn');
            fetchBtn.disabled = true;
            fetchBtn.textContent = 'Fetching...';

            showStatus('Connecting to Jira and fetching issues...', 'loading');
            
            // Clear previous selection
            selectedIssues.clear();
            updateSelectionUI();

            try {
                // Build JQL query based on preset
                const jql = buildJQL();
                console.log('Using JQL:', jql);

                // Fetch issues with all fields
                const issues = await fetchAllIssues(jiraUrl, token, jql);
                
                allIssues = issues;
                
                showStatus(`Successfully fetched ${issues.length} issues!`, 'success');
                
                // Log unique statuses found for debugging
                const uniqueStatuses = [...new Set(issues.map(i => i.fields.status?.name))];
                console.log('JQL used:', jql);
                console.log('Unique statuses found in results:', uniqueStatuses);
                
                // Update stats
                updateStats(issues);
                
                // Populate status filter
                populateStatusFilter();
                
                // Display issues
                displayIssues(issues);

                document.getElementById('statsBar').style.display = 'flex';
                document.getElementById('filtersSection').style.display = 'flex';

            } catch (error) {
                console.error('Error:', error);
                showStatus(`Error: ${error.message}. Check console for details.`, 'error');
            } finally {
                fetchBtn.disabled = false;
                fetchBtn.textContent = 'Fetch Issues';
            }
        }

        async function fetchAllIssues(jiraUrl, token, jql) {
            let allIssues = [];
            let startAt = 0;
            const maxResults = 50;
            let total = 0;
            const maxIssuesLimit = parseInt(document.getElementById('maxIssues').value) || 100;
            
            do {
                const jiraApiUrl = `${jiraUrl}/rest/api/2/search?jql=${encodeURIComponent(jql)}&startAt=${startAt}&maxResults=${maxResults}&expand=names,renderedFields`;
                
                // Use proxy to avoid CORS - works for both local and Vercel deployment
                const url = `${getProxyBase()}/api/jira-proxy?url=${encodeURIComponent(jiraApiUrl)}`;
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error('Authentication failed. Check your username/password.');
                    } else if (response.status === 403) {
                        throw new Error('Access forbidden. You may not have permission to access this project.');
                    } else {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }
                }

                const data = await response.json();
                allIssues = allIssues.concat(data.issues);
                total = data.total;
                startAt += maxResults;

                showStatus(`Fetching issues... ${allIssues.length} of ${Math.min(total, maxIssuesLimit)}`, 'loading');

            } while (startAt < total && allIssues.length < maxIssuesLimit);

            return allIssues;
        }

        function updateStats(issues) {
            document.getElementById('totalCount').textContent = issues.length;
            
            let open = 0, inProgress = 0, done = 0;
            
            issues.forEach(issue => {
                const status = issue.fields.status?.name?.toLowerCase() || '';
                allStatuses.add(issue.fields.status?.name || 'Unknown');
                
                if (status.includes('done') || status.includes('closed') || status.includes('resolved')) {
                    done++;
                } else if (status.includes('progress')) {
                    inProgress++;
                } else {
                    open++;
                }
            });

            document.getElementById('openCount').textContent = open;
            document.getElementById('inProgressCount').textContent = inProgress;
            document.getElementById('doneCount').textContent = done;
        }

        function populateStatusFilter() {
            const select = document.getElementById('statusFilter');
            select.innerHTML = '<option value="">All Statuses</option>';
            
            Array.from(allStatuses).sort().forEach(status => {
                const option = document.createElement('option');
                option.value = status;
                option.textContent = status;
                select.appendChild(option);
            });
        }

        function filterIssues() {
            const searchTerm = document.getElementById('searchFilter').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            const filtered = allIssues.filter(issue => {
                const matchesSearch = !searchTerm || 
                    issue.key.toLowerCase().includes(searchTerm) ||
                    (issue.fields.summary || '').toLowerCase().includes(searchTerm) ||
                    (issue.fields.assignee?.displayName || '').toLowerCase().includes(searchTerm) ||
                    (issue.fields.reporter?.displayName || '').toLowerCase().includes(searchTerm);

                const matchesStatus = !statusFilter || 
                    issue.fields.status?.name === statusFilter;

                return matchesSearch && matchesStatus;
            });

            displayIssues(filtered);
        }

        function getStatusClass(status) {
            if (!status) return 'status-default';
            const s = status.toLowerCase().replace(/\s+/g, '');
            if (s.includes('done') || s.includes('closed') || s.includes('resolved')) return 'status-done';
            if (s.includes('progress')) return 'status-inprogress';
            if (s.includes('blocked')) return 'status-blocked';
            if (s.includes('open') || s.includes('todo') || s.includes('new')) return 'status-open';
            return 'status-default';
        }

        function formatFieldValue(value, fieldName) {
            if (value === null || value === undefined) {
                return '<span class="empty">Not set</span>';
            }

            // Handle different field types
            if (typeof value === 'object') {
                // User fields (assignee, reporter, creator)
                if (value.displayName) {
                    return value.displayName + (value.emailAddress ? ` (${value.emailAddress})` : '');
                }
                // Status, priority, issuetype, resolution
                if (value.name) {
                    return value.name;
                }
                // Project
                if (value.key && value.name) {
                    return `${value.key} - ${value.name}`;
                }
                // Array of objects (components, labels, fixVersions, etc.)
                if (Array.isArray(value)) {
                    if (value.length === 0) return '<span class="empty">None</span>';
                    
                    const items = value.map(item => {
                        if (typeof item === 'string') return item;
                        return item.name || item.value || JSON.stringify(item);
                    });
                    
                    return `<div class="tag-list">${items.map(i => `<span class="tag">${escapeHtml(i)}</span>`).join('')}</div>`;
                }
                // Progress
                if (value.progress !== undefined) {
                    return `${value.progress} / ${value.total}`;
                }
                // Fallback for complex objects
                return `<pre class="json-view">${escapeHtml(JSON.stringify(value, null, 2))}</pre>`;
            }

            // Handle dates
            if (fieldName && (fieldName.includes('date') || fieldName.includes('Date') || 
                fieldName === 'created' || fieldName === 'updated' || fieldName === 'resolutiondate')) {
                try {
                    const date = new Date(value);
                    if (!isNaN(date)) {
                        return date.toLocaleString();
                    }
                } catch (e) {}
            }

            return escapeHtml(String(value));
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function displayIssues(issues) {
            const container = document.getElementById('issuesContainer');
            const jiraUrl = document.getElementById('jiraUrl').value.replace(/\/$/, '');

            if (issues.length === 0) {
                container.innerHTML = '<div class="issue-card"><p style="text-align: center; color: #888;">No issues found.</p></div>';
                return;
            }

            container.innerHTML = issues.map((issue, index) => {
                const fields = issue.fields;
                const statusName = fields.status?.name || 'Unknown';
                const statusClass = getStatusClass(statusName);

                // Primary fields to show always
                const primaryFields = [
                    { key: 'issuetype', label: 'Issue Type' },
                    { key: 'priority', label: 'Priority' },
                    { key: 'assignee', label: 'Assignee' },
                    { key: 'reporter', label: 'Reporter' },
                    { key: 'created', label: 'Created' },
                    { key: 'updated', label: 'Updated' },
                    { key: 'duedate', label: 'Due Date' },
                    { key: 'resolution', label: 'Resolution' },
                    { key: 'resolutiondate', label: 'Resolution Date' },
                    { key: 'labels', label: 'Labels' },
                    { key: 'components', label: 'Components' },
                    { key: 'fixVersions', label: 'Fix Versions' },
                    { key: 'versions', label: 'Affects Versions' }
                ];

                const primaryFieldsHtml = primaryFields.map(f => {
                    const value = fields[f.key];
                    return `
                        <div class="field-item">
                            <div class="field-label">${f.label}</div>
                            <div class="field-value">${formatFieldValue(value, f.key)}</div>
                        </div>
                    `;
                }).join('');

                // Description field (full width)
                const description = fields.description || '';
                const descriptionHtml = `
                    <div class="field-item full-width">
                        <div class="field-label">Description</div>
                        <div class="field-value description">${description ? escapeHtml(description) : '<span class="empty">No description</span>'}</div>
                    </div>
                `;

                return `
                    <div class="issue-card clickable-card ${selectedIssues.has(issue.key) ? 'selected' : ''}" data-key="${issue.key}" onclick="openIssueModal('${issue.key}')">
                        <input type="checkbox" class="issue-checkbox" data-key="${issue.key}" 
                               ${selectedIssues.has(issue.key) ? 'checked' : ''}
                               onclick="toggleIssueSelection('${issue.key}', this)">
                        <div class="issue-header">
                            <span class="issue-key">
                                <a href="${jiraUrl}/browse/${issue.key}" target="_blank" onclick="event.stopPropagation()">${issue.key}</a>
                            </span>
                            <span class="issue-status ${statusClass}">${statusName}</span>
                        </div>
                        <div class="issue-summary">${escapeHtml(fields.summary || 'No summary')}</div>
                        
                        <div class="issue-fields">
                            ${primaryFieldsHtml}
                            ${descriptionHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Modal functions
        function openIssueModal(issueKey) {
            const modal = document.getElementById('issueModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            
            modalTitle.textContent = `📊 ${issueKey} - Timeline & Analytics`;
            modalBody.innerHTML = '<div style="text-align: center; padding: 40px;"><div class="spinner"></div> Loading issue history...</div>';
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            fetchIssueHistory(issueKey);
        }

        function closeModal(event) {
            if (event && event.target !== event.currentTarget) return;
            const modal = document.getElementById('issueModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        async function fetchIssueHistory(issueKey) {
            const jiraUrl = document.getElementById('jiraUrl').value.replace(/\/$/, '');
            const token = document.getElementById('token').value.trim();
            
            try {
                // Fetch issue with changelog
                const apiUrl = `${jiraUrl}/rest/api/2/issue/${issueKey}?expand=changelog`;
                const url = `${getProxyBase()}/api/jira-proxy?url=${encodeURIComponent(apiUrl)}`;
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Failed to fetch issue: ${response.status}`);
                }

                const issue = await response.json();
                displayIssueTimeline(issue);
                
            } catch (error) {
                console.error('Error fetching issue history:', error);
                document.getElementById('modalBody').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #ff5252;">
                        ❌ Error loading issue history: ${error.message}
                    </div>
                `;
            }
        }

        function displayIssueTimeline(issue) {
            const modalBody = document.getElementById('modalBody');
            const fields = issue.fields;
            const changelog = issue.changelog?.histories || [];
            
            // Calculate time metrics
            const created = new Date(fields.created);
            const updated = new Date(fields.updated);
            const resolved = fields.resolutiondate ? new Date(fields.resolutiondate) : null;
            const now = new Date();
            
            const totalDays = Math.ceil((resolved || now) - created) / (1000 * 60 * 60 * 24);
            const daysSinceUpdate = Math.ceil((now - updated) / (1000 * 60 * 60 * 24));
            
            // Build timeline events
            const events = [];
            
            // Add created event
            events.push({
                date: created,
                type: 'created',
                title: 'Issue Created',
                detail: `Reported by ${fields.reporter?.displayName || 'Unknown'}`
            });
            
            // Process changelog for status changes and assignments
            changelog.forEach(history => {
                const date = new Date(history.created);
                const author = history.author?.displayName || 'Unknown';
                
                history.items.forEach(item => {
                    if (item.field === 'status') {
                        events.push({
                            date: date,
                            type: 'status',
                            title: 'Status Changed',
                            detail: `${item.fromString || 'None'} → ${item.toString}`,
                            from: item.fromString,
                            to: item.toString,
                            author: author
                        });
                    } else if (item.field === 'assignee') {
                        events.push({
                            date: date,
                            type: 'assigned',
                            title: 'Assignee Changed',
                            detail: `${item.fromString || 'Unassigned'} → ${item.toString || 'Unassigned'}`,
                            from: item.fromString,
                            to: item.toString,
                            author: author
                        });
                    } else if (item.field === 'resolution') {
                        events.push({
                            date: date,
                            type: 'resolved',
                            title: 'Resolution Set',
                            detail: `${item.fromString || 'None'} → ${item.toString || 'None'}`,
                            author: author
                        });
                    }
                });
            });
            
            // Sort events by date
            events.sort((a, b) => a.date - b.date);
            
            // Calculate time in each status
            const statusDurations = calculateStatusDurations(events, created, resolved || now);
            
            // Build HTML
            modalBody.innerHTML = `
                <!-- Issue Summary -->
                <div style="margin-bottom: 25px;">
                    <h3 style="color: #fff; margin-bottom: 10px;">${escapeHtml(fields.summary)}</h3>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <span class="issue-status ${getStatusClass(fields.status?.name)}">${fields.status?.name || 'Unknown'}</span>
                        <span style="color: #888;">Priority: ${fields.priority?.name || 'None'}</span>
                        <span style="color: #888;">Type: ${fields.issuetype?.name || 'Unknown'}</span>
                    </div>
                </div>
                
                <!-- Stats Cards -->
                <div class="issue-stats">
                    <div class="stat-card">
                        <div class="stat-icon">📅</div>
                        <div class="stat-value">${totalDays.toFixed(0)}</div>
                        <div class="stat-label">Days Since Created</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🔄</div>
                        <div class="stat-value">${daysSinceUpdate}</div>
                        <div class="stat-label">Days Since Update</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">📝</div>
                        <div class="stat-value">${changelog.length}</div>
                        <div class="stat-label">Total Changes</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">👤</div>
                        <div class="stat-value">${fields.assignee?.displayName || 'Unassigned'}</div>
                        <div class="stat-label">Current Assignee</div>
                    </div>
                </div>
                
                <!-- Status Duration Bar -->
                ${renderStatusDurationBar(statusDurations, totalDays)}
                
                <!-- Timeline -->
                <div class="timeline-section">
                    <h3>📜 Issue History Timeline</h3>
                    <div class="timeline">
                        ${events.map(event => renderTimelineItem(event)).join('')}
                    </div>
                </div>
            `;
        }

        function calculateStatusDurations(events, created, endDate) {
            const durations = {};
            let currentStatus = 'Open';
            let lastDate = created;
            
            events.forEach(event => {
                if (event.type === 'status') {
                    const duration = (event.date - lastDate) / (1000 * 60 * 60 * 24);
                    durations[currentStatus] = (durations[currentStatus] || 0) + duration;
                    currentStatus = event.to;
                    lastDate = event.date;
                }
            });
            
            // Add remaining time in current status
            const remaining = (endDate - lastDate) / (1000 * 60 * 60 * 24);
            durations[currentStatus] = (durations[currentStatus] || 0) + remaining;
            
            return durations;
        }

        function renderStatusDurationBar(durations, totalDays) {
            if (totalDays <= 0) return '';
            
            const statusColors = {
                'Open': '#2196f3',
                'Fixready': '#00bcd4',
                'In Progress': '#ff9800',
                'Resolved': '#9c27b0',
                'Closed': '#4caf50',
                'Done': '#4caf50'
            };
            
            const segments = Object.entries(durations)
                .filter(([_, days]) => days > 0)
                .map(([status, days]) => {
                    const percent = (days / totalDays) * 100;
                    const color = statusColors[status] || '#9e9e9e';
                    return `
                        <div class="bar-segment" style="width: ${percent}%; background: ${color};" title="${status}: ${days.toFixed(1)} days">
                            ${percent > 10 ? days.toFixed(0) + 'd' : ''}
                        </div>
                    `;
                }).join('');
            
            const legend = Object.entries(durations)
                .filter(([_, days]) => days > 0)
                .map(([status, days]) => {
                    const color = statusColors[status] || '#9e9e9e';
                    return `
                        <div class="legend-item">
                            <div class="legend-color" style="background: ${color};"></div>
                            <span>${status}: ${days.toFixed(1)} days</span>
                        </div>
                    `;
                }).join('');
            
            return `
                <div class="duration-bar">
                    <h4>⏱️ Time Spent in Each Status</h4>
                    <div class="bar-container">
                        ${segments}
                    </div>
                    <div class="bar-legend">
                        ${legend}
                    </div>
                </div>
            `;
        }

        function renderTimelineItem(event) {
            const dateStr = event.date.toLocaleString();
            
            return `
                <div class="timeline-item">
                    <div class="timeline-dot ${event.type}"></div>
                    <div class="timeline-content">
                        <div class="timeline-date">${dateStr}</div>
                        <div class="timeline-title">${event.title}</div>
                        <div class="timeline-detail">
                            ${event.from && event.to ? `
                                <span class="from-to">
                                    <span>${event.from || 'None'}</span>
                                    <span class="arrow">→</span>
                                    <span style="color: #00d4ff;">${event.to}</span>
                                </span>
                            ` : event.detail}
                            ${event.author ? `<div style="color: #666; margin-top: 3px;">by ${event.author}</div>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // Keyboard handler for modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Check for saved credentials on load
        document.addEventListener('DOMContentLoaded', () => {
            // Focus on token field if empty
            const tokenField = document.getElementById('token');
            if (!tokenField.value) {
                tokenField.focus();
            }
        });
    </script>
</body>
</html>
